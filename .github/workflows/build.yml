name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          # Jalankan kompilasi langsung dari root project
          gradle assembleDebug --stacktrace --warning-mode none
          
          # Salin file APK hasil kompilasi
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWorldBot-Debug-APK
          path: output_apk/*.apk
