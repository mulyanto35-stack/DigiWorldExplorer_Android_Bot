name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace --warning-mode none -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"
          
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWorldBot-Debug-APK
          path: output_apk/*.apk
