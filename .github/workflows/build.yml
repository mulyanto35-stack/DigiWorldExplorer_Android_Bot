name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper & Build APK
        run: |
          # Cari file build.gradle utama untuk menentukan lokasi proyek
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: File build.gradle tidak ditemukan!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # Buat file gradlew secara otomatis jika belum ada
          gradle wrapper
          chmod +x gradlew
          
          # Jalankan kompilasi APK
          ./gradlew assembleDebug --stacktrace
          
          # Salin hasil APK
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWorldBot-Debug-APK
          path: output_apk/*.apk
