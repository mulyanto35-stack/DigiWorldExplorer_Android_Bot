name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission & Build APK
        run: |
          # Cari lokasi file gradlew di dalam folder proyek
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: File gradlew tidak ditemukan di repository!"
            exit 1
          fi
          
          echo "Ditemukan gradlew pada: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          
          # Masuk ke folder tempat gradlew berada lalu jalankan build
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace
          
          # Salin file APK hasil build ke folder utama agar bisa di-upload
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWorldBot-Debug-APK
          path: output_apk/*.apk
